<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}사진 정리 앱{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 네비게이션 -->
  <nav class="navbar">
    <div class="nav-brand">
      <a href="{{ url_for('index') }}">
        <span class="brand-icon">📷</span>
        <span class="brand-name">사진 정리 앱</span>
      </a>
    </div>
    <div class="nav-links">
      <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
        갤러리
      </a>
      <a href="{{ url_for('albums') }}" class="nav-link {% if 'album' in request.endpoint %}active{% endif %}">
        앨범
      </a>
      <a href="{{ url_for('upload') }}" class="nav-btn">
        + 업로드
      </a>
    </div>
  </nav>

  <!-- 플래시 메시지 -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-container">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">
            {{ message }}
            <button class="flash-close" onclick="this.parentElement.remove()">×</button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <!-- 메인 콘텐츠 -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>사진 정리 앱 &copy; 2024</p>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
